name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, build, payment contracts, and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality:gate

      - name: Review public UI with isolated browser records
        id: eofy_ui
        if: github.event_name == 'pull_request' && (github.head_ref == 'codex/eofy-purchase-preview-20260907' || github.head_ref == 'codex/site-design-20260907' || github.head_ref == 'codex/search-entry-20260908' || github.head_ref == 'codex/job-offer-guide-20260908' || github.head_ref == 'codex/tax-summary-copy-20260908')
        timeout-minutes: 8
        env:
          EOFY_UI_DIR: ${{ runner.temp }}/eofy-ui
          NEXT_TELEMETRY_DISABLED: '1'
          SITE_DESIGN_REVIEW: ${{ github.head_ref == 'codex/site-design-20260907' }}
          SEARCH_ENTRY_REVIEW: ${{ github.head_ref == 'codex/search-entry-20260908' || github.head_ref == 'codex/tax-summary-copy-20260908' }}
          TAX_SUMMARY_REVIEW: ${{ github.head_ref == 'codex/tax-summary-copy-20260908' }}
          JOB_OFFER_REVIEW: ${{ github.head_ref == 'codex/job-offer-guide-20260908' }}
        run: |
          mkdir -p "$EOFY_UI_DIR"
          available_kib="$(awk '/MemAvailable/ { print $2 }' /proc/meminfo)"
          test "$available_kib" -ge 4194304
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH"
          "$CHROME_PATH" --version
          # The runner's default fonts omit Korean glyphs used throughout the UI.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match ':lang=ko' | tee "$EOFY_UI_DIR/eofy-font.log"
          npm install --prefix "$EOFY_UI_DIR" --no-save --package-lock=false --ignore-scripts playwright-core@1.63.0 axe-core@4.10.3
          if [ "$SITE_DESIGN_REVIEW" != "true" ] && [ "$SEARCH_ENTRY_REVIEW" != "true" ] && [ "$JOB_OFFER_REVIEW" != "true" ]; then node scripts/prepare-eofy-ui-fixture.mjs; fi

          # The existing development preview allows fictional workspace input.
          # Production access guards and the production bundle stay unchanged.
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3108 > "$EOFY_UI_DIR/eofy-dev-server.log" 2>&1 &
          eofy_server=$!
          trap 'eofy_exit=$?; kill "$eofy_server" 2>/dev/null || true; wait "$eofy_server" 2>/dev/null || true; exit "$eofy_exit"' EXIT
          warmup_path=/eofy-pro
          if [ "$SEARCH_ENTRY_REVIEW" = "true" ]; then warmup_path=/used-car-comparison; fi
          if [ "$JOB_OFFER_REVIEW" = "true" ]; then warmup_path=/resources/australia-job-scam-red-flags; fi
          if [ "$TAX_SUMMARY_REVIEW" = "true" ]; then warmup_path=/tax-prep-tracker; fi
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 5 "http://127.0.0.1:3108$warmup_path" > /dev/null; then break; fi
            kill -0 "$eofy_server"
            sleep 1
          done
          curl --silent --fail --max-time 10 "http://127.0.0.1:3108$warmup_path" > /dev/null
          eofy_ui_failed=0
          if [ "$JOB_OFFER_REVIEW" = "true" ]; then
            node scripts/check-job-offer-article-ui.mjs || eofy_ui_failed=1
          elif [ "$SEARCH_ENTRY_REVIEW" = "true" ]; then
            if [ "$TAX_SUMMARY_REVIEW" = "true" ]; then node scripts/check-tax-preparation.mjs; fi
            node scripts/check-search-entry-ui.mjs || eofy_ui_failed=1
          elif [ "$SITE_DESIGN_REVIEW" = "true" ]; then
            node scripts/check-site-design-ui.mjs || eofy_ui_failed=1
          else
            node scripts/check-eofy-ui-public.mjs || eofy_ui_failed=1
            node scripts/check-eofy-ui-workspace.mjs || eofy_ui_failed=1
          fi
          test "$eofy_ui_failed" -eq 0

      - name: Save browser review evidence
        if: always() && github.event_name == 'pull_request' && (github.head_ref == 'codex/eofy-purchase-preview-20260907' || github.head_ref == 'codex/site-design-20260907' || github.head_ref == 'codex/search-entry-20260908' || github.head_ref == 'codex/job-offer-guide-20260908' || github.head_ref == 'codex/tax-summary-copy-20260908') && steps.eofy_ui.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: eofy-ui-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/eofy-ui/*.png
            ${{ runner.temp }}/eofy-ui/*.json
            ${{ runner.temp }}/eofy-ui/*.log
