name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, build, payment contracts, and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality:gate

      - name: Review EOFY UI with fictional records
        id: eofy_ui
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/eofy-purchase-preview-20260907'
        timeout-minutes: 8
        env:
          EOFY_UI_DIR: ${{ runner.temp }}/eofy-ui
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          mkdir -p "$EOFY_UI_DIR"
          available_kib="$(awk '/MemAvailable/ { print $2 }' /proc/meminfo)"
          test "$available_kib" -ge 4194304
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH"
          "$CHROME_PATH" --version
          npm install --prefix "$EOFY_UI_DIR" --no-save --package-lock=false --ignore-scripts playwright-core@1.63.0 axe-core@4.10.3
          node scripts/prepare-eofy-ui-fixture.mjs

          # The existing development preview allows fictional workspace input.
          # Production access guards and the production bundle stay unchanged.
          node node_modules/next/dist/bin/next dev --hostname 127.0.0.1 --port 3108 > "$EOFY_UI_DIR/eofy-dev-server.log" 2>&1 &
          eofy_server=$!
          trap 'eofy_exit=$?; kill "$eofy_server" 2>/dev/null || true; wait "$eofy_server" 2>/dev/null || true; exit "$eofy_exit"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 5 http://127.0.0.1:3108/eofy-pro > /dev/null; then break; fi
            kill -0 "$eofy_server"
            sleep 1
          done
          curl --silent --fail --max-time 10 http://127.0.0.1:3108/eofy-pro > /dev/null
          eofy_ui_failed=0
          node scripts/check-eofy-ui-public.mjs || eofy_ui_failed=1
          node scripts/check-eofy-ui-workspace.mjs || eofy_ui_failed=1
          test "$eofy_ui_failed" -eq 0

      - name: Save EOFY browser review evidence
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'codex/eofy-purchase-preview-20260907' && steps.eofy_ui.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: eofy-ui-${{ github.event.pull_request.head.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/eofy-ui/*.png
            ${{ runner.temp }}/eofy-ui/*.json
            ${{ runner.temp }}/eofy-ui/*.log
